name: Update Market Data (CSE & UTASL)

on:
  schedule:
    # 10:15 UTC = 3:45 PM Sri Lanka Time (Monday-Friday, immediately after CSE 2:30 PM market close & settlement)
    - cron: '15 10 * * 1-5'
    # 12:30 UTC = 6:00 PM Sri Lanka Time (Monday-Friday, evening final settlement & UTASL NAV publications)
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run UTASL Scraper
        run: node scripts/update-utasl.cjs

      - name: Run CSE Market Data Updater
        run: node scripts/update-cse.cjs

      - name: Commit and push if prices updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/utasl-funds.json public/data/cse-market-data.json src/services/utaslData.ts src/services/cseStocksData.ts src/services/cseService.ts
          if git diff --staged --quiet; then
            echo "No changes in market data."
          else
            git commit -m "chore(data): update daily CSE equity prices & UTASL fund NAVs [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
